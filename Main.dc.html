<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: {{backgroundColor}};
      color: {{textColor}};
      line-height: 1.6;
    }

    a {
      color: {{accentColor}};
    }

    a:hover {
      opacity: 0.8;
    }

    .hero {
      padding: 120px 40px;
      text-align: center;
      background: linear-gradient(135deg, {{backgroundColor}} 0%, {{accentColor}}08 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 72px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 24px;
      letter-spacing: -2px;
    }

    .subtitle {
      font-size: 24px;
      font-weight: 400;
      opacity: 0.7;
      max-width: 600px;
      margin: 0 auto 40px;
    }

    .cta-button {
      display: inline-block;
      padding: 16px 40px;
      background-color: {{accentColor}};
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 500;
      font-size: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px {{accentColor}}20;
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px {{accentColor}}30;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 60px;
      padding: 100px 40px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .feature {
      text-align: center;
    }

    .feature-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      background-color: {{accentColor}}15;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .feature h3 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .feature p {
      font-size: 16px;
      opacity: 0.6;
      line-height: 1.6;
    }
  </style>
</helmet>

<div style="background: {{backgroundColor}}">
  <!-- Hero Section -->
  <div class="hero">
    <h1>{{heroTitle}}</h1>
    <p class="subtitle">{{heroSubtitle}}</p>
    <a href="#" class="cta-button">{{ctaText}}</a>
  </div>

  <!-- Features Section -->
  <div class="features">
    <sc-for list="{{features}}" as="feature" hint-placeholder-count="3">
      <div class="feature">
        <div class="feature-icon">{{feature.icon}}</div>
        <h3>{{feature.title}}</h3>
        <p>{{feature.description}}</p>
      </div>
    </sc-for>
  </div>
</div>

</x-dc>

<script data-dc-script data-props='{"backgroundColor":{"editor":"color","default":"#ffffff"},"textColor":{"editor":"color","default":"#000000"},"accentColor":{"editor":"color","default":"#007AFF"},"heroTitle":{"editor":"text","default":"Designed for Perfection"},"heroSubtitle":{"editor":"text","default":"Simple, elegant, and beautiful. Everything you need in one place."},"ctaText":{"editor":"text","default":"Get Started"}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      backgroundColor: this.props.backgroundColor ?? '#ffffff',
      textColor: this.props.textColor ?? '#000000',
      accentColor: this.props.accentColor ?? '#007AFF',
      heroTitle: this.props.heroTitle ?? 'Designed for Perfection',
      heroSubtitle: this.props.heroSubtitle ?? 'Simple, elegant, and beautiful. Everything you need in one place.',
      ctaText: this.props.ctaText ?? 'Get Started',
      features: [
        {
          icon: '⚡',
          title: 'Lightning Fast',
          description: 'Optimized performance for every interaction'
        },
        {
          icon: '🎨',
          title: 'Beautiful Design',
          description: 'Crafted with attention to every detail'
        },
        {
          icon: '🔒',
          title: 'Secure & Private',
          description: 'Your data is protected with enterprise security'
        }
      ]
    };
  }
}
</script>
</body>
</html>
